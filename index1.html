<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Finder</title>
  <style>
    body {
      margin: 0;
      background: #f2f4f7;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .navbar {
      padding: 14px 24px;
      background: #3157a4;
    }

    .navbar-content {
      display: flex;
      max-width: 1000px;
      margin: 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
    }

    .navbar-brand {
      font-size: 20px;
      font-weight: bold;
    }

    .navbar-links {
      display: flex;
      gap: 18px;
    }

    .navbar-links a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
    }

    h1, .hint {
      text-align: center;
    }

    form, #product {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
    }

    button {
      border: 0;
      border-radius: 4px;
      background: #3157a4;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
      cursor: wait;
    }

    #message {
      min-height: 20px;
    }

    .error {
      color: #b3263e;
    }

    #product {
      margin-top: 20px;
    }

    #product-image {
      display: block;
      width: 100%;
      max-width: 300px;
      max-height: 280px;
      margin: 0 auto;
      object-fit: contain;
    }

    #price {
      color: #287443;
      font-size: 20px;
      font-weight: bold;
    }

    [hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      .navbar {
        padding: 14px 16px;
      }

      .navbar-content {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .navbar-links {
        gap: 14px;
      }

      main {
        padding: 16px;
      }

      form, #product {
        padding: 14px;
      }

      .search-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-content">
      <a class="navbar-brand" href="#home">Product Finder</a>
      <div class="navbar-links">
        <a href="#home">Home</a>
        <a href="#search-form">Search</a>
        <a href="#product">Product</a>
      </div>
    </div>
  </nav>

  <main>
    <h1 id="home">Product Finder</h1>
    <p class="hint">Enter a product ID to search.</p>

    <form id="search-form">
      <label for="product-id">Product ID</label>
      <div class="search-row">
        <input id="product-id" type="number" min="1" step="1"  required>
        <button id="search-button" type="submit">Search</button>
      </div>
      <p id="message" aria-live="polite"></p>
    </form>

    <section id="product" aria-live="polite" hidden>
      <img id="product-image" alt="">
      <h2 id="title"></h2>
      <p id="price"></p>
      <p id="category"></p>
      <p id="rating"></p>
      <p id="description"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("search-form");
    const productIdInput = document.getElementById("product-id");
    const searchButton = document.getElementById("search-button");
    const message = document.getElementById("message");
    const productSection = document.getElementById("product");

    // Search the API when the form is submitted.
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const productId = productIdInput.value;
      message.textContent = "Loading...";
      message.classList.remove("error");
      productSection.hidden = true;
      searchButton.disabled = true;

      try {
        // fetch() makes an AJAX request to the product API.
        const response = await fetch("https://dummyjson.com/products/" + productId);

        if (response.status === 404) {
          message.textContent = "Product not found";
          message.classList.add("error");
          return;
        }

        if (!response.ok) {
          throw new Error("The product request failed.");
        }

        const product = await response.json();
        showProduct(product);
        message.textContent = "";
      } catch (error) {
        console.error("Could not load the product.", error);
        message.textContent = "Could not load the product. Please try again.";
        message.classList.add("error");
      } finally {
        searchButton.disabled = false;
      }
    });

    // Put product information into the page.
    function showProduct(product) {
      const image = document.getElementById("product-image");
      image.src = product.thumbnail;
      image.alt = product.title;

      document.getElementById("title").textContent = product.title;
      document.getElementById("price").textContent = "Price: $" + product.price;
      document.getElementById("category").textContent = "Category: " + product.category;
      document.getElementById("rating").textContent = "Rating: " + product.rating;
      document.getElementById("description").textContent = product.description;

      productSection.hidden = false;
    }
  </script>
</body>
</html>
